services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: rea-postgres-compose
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: real_estate_ai_agent
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - rea_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d real_estate_ai_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/RealEstateAiAgent.Api
      dockerfile: Dockerfile
    container_name: rea-api
    ports:
      - "${API_HOST_PORT:-5134}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=real_estate_ai_agent;Username=postgres;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: RealEstateAiAgent
      Jwt__Audience: RealEstateAiAgent.Client
      Bedrock__Region: ${AWS_DEFAULT_REGION:-us-east-1}
      Bedrock__ModelId: ${BEDROCK_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rea_pg_data:
